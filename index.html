<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>페낭 항공권</title>
  <meta name="description" content="인천⇄페낭 왕복 항공권 비교 (말레이시아항공·싱가포르항공·대한항공)" />
  <meta name="theme-color" content="#0f7f73" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="페낭 항공권" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div>
        <h1>인천 ⇄ 페낭 왕복</h1>
        <p class="status" id="status">연결 중…</p>
      </div>
      <button class="icon-btn" id="settings" aria-label="PIN 설정" title="PIN 설정">⚙️</button>
    </div>
  </header>

  <main>
    <div class="card install" id="install" hidden></div>

    <section class="card">
      <div class="card-head"><h2>① 여행 기간</h2><span class="hint">왕복 · 성인 1명</span></div>
      <div class="form">
        <label class="field">
          <span>가는 날 (인천 출발)</span>
          <div class="row2">
            <input type="date" id="outDate" required />
            <select id="outFlex" aria-label="가는 날 앞뒤">
              <option value="0">정확히</option><option value="1">±1일</option><option value="2">±2일</option><option value="3">±3일</option>
            </select>
          </div>
        </label>
        <label class="field">
          <span>오는 날 (페낭 출발)</span>
          <div class="row2">
            <input type="date" id="backDate" required />
            <select id="backFlex" aria-label="오는 날 앞뒤">
              <option value="0">정확히</option><option value="1">±1일</option><option value="2">±2일</option><option value="3">±3일</option>
            </select>
          </div>
        </label>
        <label class="check"><input type="checkbox" id="incKE" /> 대한항공(쿠알라룸푸르 직항 + 육로)도 함께 비교</label>
        <div class="chips-light">
          <span>말레이시아항공</span><span>싱가포르항공</span><span>대한항공</span><span>경유 1회 · 대기 1시간 40분~3시간</span>
        </div>
        <p class="estimate" id="estimate"></p>
        <button class="btn primary wide" id="searchBtn">🔍 왕복 항공권 조회</button>
        <div class="progress" id="progress" hidden><div class="bar"><i id="progressBar"></i></div><span id="progressText"></span></div>
      </div>
    </section>

    <div id="results" hidden>
      <section class="card">
        <div class="card-head"><h2>② 항공사별 한눈에 비교</h2><span class="hint">줄을 누르면 상세</span></div>
        <div id="compare"></div>
      </section>

      <section class="card">
        <div class="card-head"><h2>📋 전체 항공편 기록</h2><span class="hint">편명 · 출발시각</span></div>
        <div id="flightLog"></div>
      </section>

      <div id="airCards"></div>

      <section class="card">
        <div class="card-head"><h2>🔔 가격 알림</h2><button class="btn small" id="recheck">지금 확인</button></div>
        <div id="watch"></div>
      </section>
    </div>

    <p class="foot">가격은 구글 플라이트 실시간 시세입니다. 최종 금액은 예약 화면에서 확인하세요.</p>
  </main>

  <script src="ground.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
