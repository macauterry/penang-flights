# 매일 아침 7시(한국 시각)에 인터넷(GitHub)에서 가격을 새로 알아보고 data/prices.json 을 저장합니다.
# PC를 꺼 두어도 동작합니다. 키는 GitHub 저장소의 Settings → Secrets 에 SERPAPI_KEY 로 넣습니다.
name: 가격 업데이트

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: '이번에 조회할 최대 횟수 (비우면 자동)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 가격 조회
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: ${{ vars.APP_URL }}
          MAX_RUNS: ${{ inputs.max }}
        run: node tools/update.mjs ${MAX_RUNS:+--max "$MAX_RUNS"}
      - name: 결과 저장
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "가격 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash
          git push
